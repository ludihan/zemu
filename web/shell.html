<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#141c58">
	<link rel="icon" href="icon.png">
	<title>ZEMU</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
		canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; image-rendering: pixelated; }
		#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
			color: #9aa6f0; font: 14px monospace; letter-spacing: 2px; pointer-events: none; }
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
	<div id="status">LOADING...</div>
	<script>
		var Module = {
			canvas: document.getElementById('canvas'),
			// ?arg=<core path>&arg=<game path> starts a game straight away.
			arguments: new URLSearchParams(location.search).getAll('arg'),
			onRuntimeInitialized: function () { document.getElementById('status').remove(); },
			setStatus: function (s) { var el = document.getElementById('status'); if (el && s) el.textContent = s.toUpperCase(); },
		};
	</script>
	{{{ SCRIPT }}}
</body>
</html>
